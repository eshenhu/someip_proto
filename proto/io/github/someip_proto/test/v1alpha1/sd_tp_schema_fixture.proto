  }];
}

// Carries a bounded notification whose actual payload may exceed the UDP budget.
message StaticSDTPMayPayload {
  option (io.github.someip_proto.options.v1alpha1.message) = {
    struct_layout: {length_field_width: LENGTH_FIELD_WIDTH_NONE}
  };

  bytes data = 1 [(io.github.someip_proto.options.v1alpha1.field) = {
    wire_order: 1
    array: {
      length_field_width: LENGTH_FIELD_WIDTH_16
      max_items: 1500
    }
    max_encoded_bytes: 1502
  }];
}

// Carries an exact notification payload that requires TP on the fixture UDP transport.
message StaticSDTPRequiredPayload {
  option (io.github.someip_proto.options.v1alpha1.message) = {
    struct_layout: {length_field_width: LENGTH_FIELD_WIDTH_NONE}
  };

  bytes data = 1 [(io.github.someip_proto.options.v1alpha1.field) = {
    wire_order: 1
    array: {
      length_field_width: LENGTH_FIELD_WIDTH_NONE
      fixed_items: 1500
    }
    max_encoded_bytes: 1500
  }];
}

// Exercises static SD offers, consumer selectors and subscriptions, and all derived TP-use boundaries.
service StaticSDTPService {
  option (io.github.someip_proto.options.v1alpha1.service) = {
    interface_major_version: 1
    interface_minor_version: 0
    service_lineage: {id: "sd-tp.fixture"}
    event_groups: {
      name: "unicast_updates"
      id: 1
    }
    event_groups: {
      name: "multicast_updates"
      id: 2
    }
    events: {
      name: "may_update"
      id: 0x8001
      payload_type: {fqn: ".io.github.someip_proto.test.v1alpha1.StaticSDTPMayPayload"}
      event_group_names: "multicast_updates"
      publication: {kind: PUBLICATION_POLICY_KIND_ON_CHANGE}
    }
    fields: {
      name: "required_state"
      value_type: {fqn: ".io.github.someip_proto.test.v1alpha1.StaticSDTPRequiredPayload"}
      notifier_id: 0x8002
      event_group_names: "unicast_updates"
      publication: {kind: PUBLICATION_POLICY_KIND_ON_CHANGE}
    }
  };

  // Exercises a TP-enabled member whose request and response never require segmentation.
  rpc GetState(StaticSDTPServiceGetStateRequest) returns (StaticSDTPServiceGetStateResponse) {
    option (io.github.someip_proto.options.v1alpha1.method) = {
      member_id: 1
      kind: METHOD_KIND_REQUEST_RESPONSE
      response_policy: RESPONSE_POLICY_RESPONSE_ONLY
    };
  }

  // Exercises a TP-disabled member with request, response, and exception directions.
  rpc SetState(StaticSDTPServiceSetStateRequest) returns (StaticSDTPServiceSetStateResponse) {
    option (io.github.someip_proto.options.v1alpha1.method) = {
      member_id: 2
      kind: METHOD_KIND_REQUEST_RESPONSE
      response_policy: RESPONSE_POLICY_RESPONSE_OR_EXCEPTION
      exception_payload_type: {fqn: ".io.github.someip_proto.test.v1alpha1.StaticSDTPSmallException"}
    };
  }
}
