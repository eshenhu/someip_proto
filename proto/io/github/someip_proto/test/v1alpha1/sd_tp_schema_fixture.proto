// Carries the small GetState request payload that always fits the fixture UDP budget.
message StaticSDTPServiceGetStateRequest {
  option (io.github.someip_proto.options.v1alpha1.message) = {
    struct_layout: {length_field_width: LENGTH_FIELD_WIDTH_NONE}
  };

  uint32 value = 1 [(io.github.someip_proto.options.v1alpha1.field) = {
    wire_order: 1
    scalar_representation: SCALAR_REPRESENTATION_UNSIGNED_INTEGER_8
  }];
}

// Carries the small GetState response payload that always fits the fixture UDP budget.
message StaticSDTPServiceGetStateResponse {
  option (io.github.someip_proto.options.v1alpha1.message) = {
    struct_layout: {length_field_width: LENGTH_FIELD_WIDTH_NONE}
  };

  uint32 value = 1 [(io.github.someip_proto.options.v1alpha1.field) = {
    wire_order: 1
    scalar_representation: SCALAR_REPRESENTATION_UNSIGNED_INTEGER_8
  }];
}

