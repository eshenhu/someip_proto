option (io.github.someip_proto.options.v1alpha1.file) = {default_byte_order: BYTE_ORDER_BIG_ENDIAN};

// Verifies that a complete manifest type is usable by another public schema.
message ManifestSchemaFixture {
  io.github.someip_proto.manifest.v1alpha1.Manifest manifest = 1;
}

// Payload used to verify message and field aggregate options.
message SchemaFixturePayload {
  option (io.github.someip_proto.options.v1alpha1.message) = {
    struct_layout: {length_field_width: LENGTH_FIELD_WIDTH_NONE}
  };

  uint32 value = 1 [(io.github.someip_proto.options.v1alpha1.field) = {
    wire_order: 1
    scalar_representation: SCALAR_REPRESENTATION_UNSIGNED_INTEGER_32
  }];

  oneof choice {
    option (io.github.someip_proto.options.v1alpha1.oneof) = {
      wire_order: 2
      discriminator_width_bits: 8
      length_field_width: LENGTH_FIELD_WIDTH_8
      header_order: UNION_HEADER_ORDER_TYPE_THEN_LENGTH
      max_encoded_bytes: 5
    };

    uint32 alternative_value = 2 [(io.github.someip_proto.options.v1alpha1.field) = {
      scalar_representation: SCALAR_REPRESENTATION_UNSIGNED_INTEGER_32
      union_type_id: 1
    }];
  }
}

// Verifies that enum and enum-value aggregate options resolve successfully.
enum SchemaFixtureEnum {
  option (io.github.someip_proto.options.v1alpha1.enum) = {wire_width_bits: 8};

  SCHEMA_FIXTURE_ENUM_UNSPECIFIED = 0 [(io.github.someip_proto.options.v1alpha1.enum_value) = {non_sendable_placeholder: true}];
  SCHEMA_FIXTURE_ENUM_ENABLED = 1;
}

// Request used to verify method-option registration.
message GetRequest {}

// Response used to verify method-option registration.
message GetResponse {
  SchemaFixturePayload payload = 1;
}

// Verifies that aggregate service and method options resolve successfully.
service SchemaFixtureService {
  option (io.github.someip_proto.options.v1alpha1.service) = {
    interface_major_version: 1
    interface_minor_version: 0
    event_groups: {
      name: "updates"
      id: 1
    }
    events: {
      name: "value_changed"
      id: 32769
      payload_type: {fqn: ".io.github.someip_proto.test.v1alpha1.SchemaFixturePayload"}
      event_group_names: "updates"
      publication: {kind: PUBLICATION_POLICY_KIND_ON_CHANGE}
    }
