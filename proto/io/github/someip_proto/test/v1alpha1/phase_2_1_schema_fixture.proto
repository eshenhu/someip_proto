// Exercises zero-width unions with unequal fixed-size alternatives.
message UnequalFixedZeroWidthUnion {
  option (io.github.someip_proto.options.v1alpha1.message) = {
    struct_layout: {length_field_width: LENGTH_FIELD_WIDTH_NONE}
  };

  oneof value {
    option (io.github.someip_proto.options.v1alpha1.oneof) = {
      wire_order: 1
      discriminator_width_bits: 8
      length_field_width: LENGTH_FIELD_WIDTH_NONE
      header_order: UNION_HEADER_ORDER_TYPE_THEN_LENGTH
      max_encoded_bytes: 3
    };

    uint32 one_byte = 1 [(io.github.someip_proto.options.v1alpha1.field) = {
      scalar_representation: SCALAR_REPRESENTATION_UNSIGNED_INTEGER_8
      union_type_id: 1
    }];
    uint32 two_bytes = 2 [(io.github.someip_proto.options.v1alpha1.field) = {
      scalar_representation: SCALAR_REPRESENTATION_UNSIGNED_INTEGER_16
      union_type_id: 2
    }];
  }
}

