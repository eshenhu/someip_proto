      discriminator_width_bits: 8
      length_field_width: LENGTH_FIELD_WIDTH_NONE
      header_order: UNION_HEADER_ORDER_TYPE_THEN_LENGTH
      max_encoded_bytes: 9
    };

    string dynamic_value = 1 [(io.github.someip_proto.options.v1alpha1.field) = {
      string: {
        encoding: STRING_ENCODING_UTF8
        length_field_width: LENGTH_FIELD_WIDTH_8
        max_encoded_bytes: 8
      }
      union_type_id: 1
      max_encoded_bytes: 8
    }];
    uint32 scalar_value = 2 [(io.github.someip_proto.options.v1alpha1.field) = {
      scalar_representation: SCALAR_REPRESENTATION_UNSIGNED_INTEGER_8
      union_type_id: 2
    }];
