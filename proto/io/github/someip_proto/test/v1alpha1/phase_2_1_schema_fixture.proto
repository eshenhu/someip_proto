    scalar_representation: SCALAR_REPRESENTATION_UNSIGNED_INTEGER_8
  }];
  uint32 following_word = 2 [(io.github.someip_proto.options.v1alpha1.field) = {
    wire_order: 2
    scalar_representation: SCALAR_REPRESENTATION_UNSIGNED_INTEGER_32
    alignment_bytes: 4
  }];
}

